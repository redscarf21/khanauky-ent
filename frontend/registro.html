<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Industria Khanauky</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/khanauky.css">
  <style>
    body { background: linear-gradient(160deg, var(--azul-profundo) 0%, #133f59 55%, var(--azul-marca) 100%); min-height: 100vh; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 110px 16px 60px; }
    .card-reg { background: var(--blanco); border-radius: var(--r-card); box-shadow: var(--shadow-media); width: 100%; max-width: 600px; padding: 2.6rem; }
    .tipo-selector { display: flex; gap: 12px; margin-bottom: 1.5rem; }
    .tipo-btn { flex: 1; padding: 14px; border: 2px solid var(--borde-suave); border-radius: var(--r-md); background: white; cursor: pointer; text-align: center; transition: var(--tr); }
    .tipo-btn:hover { border-color: var(--azul-marca); }
    .tipo-btn.activo { border-color: var(--azul-marca); background: #EFF7FB; }
    .tipo-btn i { font-size: 1.5rem; color: var(--azul-marca); display: block; margin-bottom: 6px; }
    .tipo-btn span { font-weight: 600; font-size: 0.9rem; color: var(--texto-oscuro); }
    .error-text { color: #C53030; font-size: 0.88rem; font-weight: 600; min-height: 18px; }
    .bloque-oculto { display: none; }
  </style>
</head>
<body>
  <div id="navbarSlot"></div>
  <div class="wrap">
    <div class="card-reg">
      <div class="text-center mb-4">
        <i class="bi bi-droplet-fill text-azul-marca fs-2"></i>
        <h2 class="mb-1">Crea tu cuenta</h2>
        <p class="text-mid small mb-0">Regístrate para empezar a pedir agua y hielo Aquaelis.</p>
      </div>

      <p class="fw-semibold small mb-2">¿Cómo vas a registrarte?</p>
      <div class="tipo-selector">
        <button class="tipo-btn activo" id="btnPersona" type="button">
          <i class="bi bi-person"></i>
          <span>Persona natural</span>
        </button>
        <button class="tipo-btn" id="btnEmpresa" type="button">
          <i class="bi bi-building"></i>
          <span>Empresa</span>
        </button>
      </div>

      <form id="registroForm" novalidate>
        <div class="row g-3">
          <div class="col-12 bloque-persona">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombres *</label>
                <input type="text" class="form-control" id="nombres" placeholder="Ej. Juan Carlos">
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellidos *</label>
                <input type="text" class="form-control" id="apellidos" placeholder="Ej. García López">
              </div>
              <div class="col-md-6">
                <label class="form-label">DNI *</label>
                <input type="text" class="form-control" id="dni" maxlength="8" placeholder="12345678">
              </div>
              <div class="col-md-6">
                <label class="form-label">Sexo *</label>
                <select class="form-select" id="sexo">
                  <option value="M">Masculino</option>
                  <option value="F">Femenino</option>
                </select>
              </div>
            </div>
          </div>

          <div class="col-12 bloque-empresa bloque-oculto">
            <div class="row g-3">
              <div class="col-md-7">
                <label class="form-label">Razón social *</label>
                <input type="text" class="form-control" id="razonSocial" placeholder="Ej. Distribuidora ABC S.A.C.">
              </div>
              <div class="col-md-5">
                <label class="form-label">RUC *</label>
                <input type="text" class="form-control" id="ruc" maxlength="11" placeholder="20123456789">
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Usuario *</label>
            <input type="text" class="form-control" id="usuario" placeholder="mi_usuario">
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico *</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Contraseña *</label>
            <input type="password" class="form-control" id="pass" minlength="6">
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirmar contraseña *</label>
            <input type="password" class="form-control" id="passConfirmar" minlength="6">
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono *</label>
            <input type="text" class="form-control" id="telefono" placeholder="987654321">
          </div>
          <div class="col-md-6">
            <label class="form-label">Distrito *</label>
            <select class="form-select" id="ubigeoId">
              <option value="">Cargando distritos...</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Dirección exacta *</label>
            <input type="text" class="form-control" id="direccion" placeholder="Calle, número, referencia">
          </div>
        </div>

        <button type="submit" class="btn-khanauky-primario w-100 mt-4">Crear mi cuenta</button>
        <p id="error-msg" class="error-text mt-2 mb-0"></p>
        <p class="small text-center mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="login.html" class="fw-bold">Inicia sesión</a>
        </p>
      </form>
    </div>
  </div>

  <div id="footerSlot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>inicializarLayout();</script>
  <script src="js/registro.js"></script>
</body>
</html>
